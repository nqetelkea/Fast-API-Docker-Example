name: Push Docker Image

on:
    push:
        branches:
            - main
    pull request:
        branches:
            - main

jobs:
    build-and-test:
        runs-on : ubuntu-latest
        
        steps:
            # 1. Check out our repository so the workflow can access it
            -   name: check out repository
                uses : actions/checkout@v4

            # 2. Set up specific version oh Python
            -   name: Set up Python
                uses: action/setup-python@v5
                with:
                    python-version: '3.10'

            # 3. Install dependencies
            -   name: Install dependencies
                run: python -m pip install --upgrade pip
                     pip install -r requirements.txt
            
            # 4. Run the tests
            -   name: Run test with pytest
                run: pytest

    push-to-repo:
        runs-on: ubuntu-latest
        needs: build-and-test
        #Only run on push event, not pull-request
        if: github.event_name == 'push'
        steps:
            -   name: Checkout Code
                uses: actions/checkout@v4

            -   name: Setup docker Buildx
                uses: docker/setup-buildx-action@v2
                
            -   name: Login to Docker Hub
                uses: docker/login-action@v2
                with:
                        username: ${{secrets.DOCKER_HUB_USERNAME}}
                        password: ${{secrets.DOCKER_HUB_TOKEN}}
            
                name: Build and Push
                uses: docker/build-push-action@v4
                with:
                    context: .
                    push: true
                    platforms: linux/amd64, linux/arm64
                    tags: nqetelkea/fast-api-docker-example:latest
